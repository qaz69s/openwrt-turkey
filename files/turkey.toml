# Turkey (Telemt) 配置文件
# 由 turkey-ctrl.sh 根据 UCI 自动生成

[general]
use_middle_proxy = false
log_level = "normal"
fast_mode = true
update_every = 43200
hardswap = false

[general.modes]
classic = false
secure = false
tls = true

[network]
ipv4 = true
ipv6 = true
prefer = 4
multipath = false

[timeouts]
client_first_byte_idle_secs = 300
client_handshake = 60
client_keepalive = 60
client_ack = 300

[censorship]
tls_domain = "www.baidu.com"
mask = true
mask_port = 443
tls_emulation = true
fake_cert_len = 2048
tls_front_dir = "/var/lib/turkey/tlsfront"

[access]
user_max_tcp_conns_global_each = 0
replay_check_len = 65536
replay_window_secs = 120
ignore_time_skew = false

[access.users]
hello = "00000000000000000000000000000000"

[[upstreams]]
type = "direct"
enabled = true
weight = 10
